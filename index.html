<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex - 1996</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="icon" type="image/png" href="./icons/Poké_Ball_icon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light">
    <header>
        <nav class="navbar navbar-expand-md w-100">
            <div class="container-fluid">
                <a class="navbar-logo h1 mb-0" href="#">Pokédex</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#collapsibleNavbar">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-end" id="collapsibleNavbar">
                    <ul class="navbar-nav align-items-center">
                        <li class="nav-item" style="margin-right: 15px;">
                            <a href="./pages/info.html#o-que-e">O que é a Pokédex?</a>
                        </li>
                        <li class="nav-item" style="margin-right: 15px;">
                            <a href="./pages/info.html#type-chart">Interações entre tipos</a>
                        </li>
                        <li class="nav-item">
                            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalRelatar">
                                Relatar Problema
                            </button>
                            <div class="modal fade" id="modalRelatar" style="color: white;">
                                <div class="modal-dialog modal-dialog-fullscreen-sm-down modal-dialog-centered">
                                    <div class="modal-content">
                                        <div class="modal-header" style="background-color: #d62828; border: 0;">
                                            <h4 class="modal-title" style="color: white;">Relatar Problema</h4>
                                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                        </div>
                                        <div class="modal-body bg-dark">
                                            <div class="form-group">
                                                <textarea placeholder="Descreva o problema encontrado" class="form-control bg-light text-dark" rows="4" id="descricao" name="descricao" required></textarea>
                                            </div>
                                        </div>
                                        <div class="modal-footer d-flex justify-content-between" style="background-color: #d62828; border: 0;">
                                            <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Fechar</button>
                                            <button type="button" class="btn btn-success" data-bs-dismiss="modal" id="enviar">Enviar</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <main>
        <div class="input-group mb-3">
            <input type="text" class="form-control" id="pesquisa" placeholder="Pesquisar Pokémon">
            <button class="btn btn-primary" type="button" id="btnPesquisa">
                Pesquisar
            </button>
        </div>
        <section class="list" id="list">
        </section>
    </main>
    <footer>
        © 2026 Pokédex - 1996 — Este é um site informativo de fãs. Pokémon e todos os nomes de personagens relacionados são marcas registradas da The Pokémon Company, Nintendo, Game Freak e Creatures Inc.
    </footer>
<script src="js/script.js"></script>
</body>
</html>
