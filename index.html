<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex: 1996</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <header>
        <h1>Pokédex</h1>
    </header>
    <section class="list">
        <div class="poke-line">
            <span class="poke-number">001</span>
            <img src="icons/poke-icons/1.png" alt="Bulbassaur" class="poke-img">
            <span class="poke-name">Bulbassaur</span>
            <span class="poke-type"><img src="icons/type-icons/grass.svg" alt="grass"><img src="icons/type-icons/poison.svg" alt="poison"></span>
        </div>
        <div class="poke-line">
            <span class="poke-number">002</span>
            <img src="icons/poke-icons/2.png" alt="Ivysaur" class="poke-img">

            <span class="poke-type"><img src="icons/type-icons/grass.svg" alt="grass"><img src="icons/type-icons/poison.svg" alt="poison"></span>
        </div>
        <div class="poke-line">
            <span class="poke-number">003</span>
            <img src="icons/poke-icons/3.png" alt="Venusaur" class="poke-img">

        </div>

        <div class="poke-line">

            <span class="poke-type"><img src="icons/type-icons/water.svg" alt="water"></span>
        </div>
        <div class="poke-line">
            <span class="poke-number">009</span>
            <img src="icons/poke-icons/9.png" alt="Blastoise" class="poke-img">

            <span class="poke-type"><img src="icons/type-icons/water.svg" alt="water"></span>
